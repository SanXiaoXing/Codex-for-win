[package]
name = "codexbar-windows-mvp"
version = "0.1.0"
description = "Windows tray usage monitor for Codex and WorkBuddy"
authors = ["CodexBar"]
edition = "2021"

[lib]
name = "codexbar_windows_mvp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["macros", "time"] }
# Win11 DWM 圆角偏好（DwmSetWindowAttribute / DWMWA_WINDOW_CORNER_PREFERENCE）
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
